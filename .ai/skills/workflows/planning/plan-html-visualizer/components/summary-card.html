<!--
  Summary card — goals, scope, key changes, constraints, major risks.
  Repeat the highlight <li> per key point.
-->
<section
  class="plan-component plan-summary-card"
  data-view-id="{{view_id}}"
  data-component="summary-card"
  data-semantic-node-id="{{semantic_node_id}}"
>
  <h2>{{title}}</h2>
  <p class="summary-lead">{{summary}}</p>
  <ul class="summary-highlights">
    <li>{{highlight}}</li>
  </ul>
</section>
